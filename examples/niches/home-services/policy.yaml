# Example starter config for a home services (HVAC, plumbing, electrical) use case:
# appointment confirmations and arrival-window reminders.
# Fictional business and fictional NANP test number (555-01xx block). Not a real number.
# Copy this file to policy.yaml at the repo root (or point POLICY_FILE at it), then replace
# allowed_numbers with your own phone number in E.164 before placing a real test call.
dry_run: true
allowed_numbers:
  - "+13125550102"
caller_name: "Example Reliable Home Services"
max_per_hour: 8
max_message_length: 500
blocklist_file: examples/niches/home-services/blocklist.example.txt
