# Example starter config for an insurance agency reminding an existing, opted-in policyholder
# about a renewal or scheduled review call.
# Fictional business and fictional NANP test number (555-01xx block). Not a real number.
# Copy this file to policy.yaml at the repo root (or point POLICY_FILE at it), then replace
# allowed_numbers with your own phone number in E.164 before placing a real test call.
dry_run: true
allowed_numbers:
  - "+14045550105"
caller_name: "Example Harbor Point Insurance"
max_per_hour: 5
max_message_length: 500
blocklist_file: examples/niches/insurance/blocklist.example.txt
